[project]
name = "toph-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.128.2",
    "uvicorn==0.34.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "SQLAlchemy==2.0.50",
    "psycopg[binary]==3.2.9",
    "GeoAlchemy2==0.17.1",
    "alembic==1.18.4",
    "argon2-cffi==25.1.0",
    "boto3==1.43.18",
    "httpx==0.28.1",
    "python-dotenv==1.1.0",
    "tzdata==2025.2",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires an explicitly configured disposable PostGIS database"]
