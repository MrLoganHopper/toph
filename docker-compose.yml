services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: toph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure_local.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - toph-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toph"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  toph-postgres:
