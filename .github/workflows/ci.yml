name: TOPH checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: toph_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d toph_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:disposable-ci-database-only@127.0.0.1:5432/toph_test
      MIGRATION_DATABASE_URL: postgresql://postgres:disposable-ci-database-only@127.0.0.1:5432/toph_test
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-database-only@127.0.0.1:5432/toph_test
      TOPH_TEST_RESET: 'YES'
      POSTGIS_SCHEMA: public
      COOKIE_SECURE: 'false'
      APP_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated test secrets
        shell: bash
        run: |
          for name in CSRF_SECRET RATE_LIMIT_SECRET SEED_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            if [ "$name" = SEED_PASSWORD ]; then echo "E2E_PASSWORD=$value" >> "$GITHUB_ENV"; fi
          done
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Backend unit, provider-boundary, and real PostGIS tests
        working-directory: backend
        run: python -m pytest -q
      - name: Generate and check API contract
        run: python scripts/export_openapi.py
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Prepare a fresh disposable browser fixture
        shell: bash
        run: |
          python scripts/reset_test_schema.py
          cd backend
          python -m alembic upgrade head
          python -m app.cli seed
      - name: Install Chromium for browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start test API and run browser checks
        shell: bash
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-ci.log 2>&1 &
          cd ../frontend
          for i in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:8000/healthz; then break; fi; sleep 1; done
          npm run test:e2e
      - name: Preserve browser evidence and resolved frontend lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/package-lock.json
            backend-ci.log
            docs/openapi.json
